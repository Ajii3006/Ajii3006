<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Attacking Depression - 3D Therapy Game</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Game UI */
        .game-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
        }

        .health-bar {
            flex: 1;
            max-width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 10px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573);
            width: 100%;
            transition: width 0.3s ease;
        }

        .score {
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: all;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .control-btn:hover, .control-btn:active {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .music-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .fire-btn {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #ff4757;
            width: 80px;
            height: 80px;
            font-size: 30px;
        }

        /* Menu Overlay */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: all;
        }

        .menu-title {
            font-size: 3em;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255,255,255,0.5); }
            to { text-shadow: 0 0 30px rgba(255,255,255,0.8); }
        }

        .menu-subtitle {
            color: #ccc;
            font-size: 1.2em;
            margin-bottom: 40px;
            text-align: center;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .start-btn:hover, .start-btn:active {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        /* Hidden file inputs */
        .hidden {
            display: none;
        }

        /* Particle effect overlay */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        /* Hit indicator */
        .hit-indicator {
            position: absolute;
            color: #ff4757;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            z-index: 1500;
            animation: hitFade 1s ease-out forwards;
        }

        @keyframes hitFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5) translateY(-50px); }
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .menu-title {
                font-size: 2.5em;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            
            .fire-btn {
                width: 70px;
                height: 70px;
                font-size: 25px;
            }
            
            .top-bar {
                padding: 8px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Overlay -->
    <div id="menuOverlay" class="menu-overlay">
        <h1 class="menu-title">ATTACKING DEPRESSION</h1>
        <p class="menu-subtitle">Transform your struggles into strength</p>
        <button id="startBtn" class="start-btn">🎯 START THERAPY</button>
    </div>

    <!-- Game UI -->
    <div class="game-ui" id="gameUI" style="display: none;">
        <div class="top-bar">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="health-bar">
                <div class="health-fill" id="healthFill"></div>
            </div>
            <div class="score">Hits: <span id="hits">0</span></div>
        </div>

        <div class="crosshair"></div>

        <div class="control-panel">
            <button class="control-btn upload-btn" id="uploadBtn" title="Upload Image">📷</button>
            <button class="control-btn music-btn" id="musicBtn" title="Background Music">🎵</button>
            <button class="control-btn fire-btn" id="fireBtn" title="Fire!">🔥</button>
        </div>
    </div>

    <!-- Particle Effects -->
    <canvas class="particles" id="particles"></canvas>

    <!-- Hidden file inputs -->
    <input type="file" id="imageInput" class="hidden" accept="image/*" capture="environment">
    <input type="file" id="musicInput" class="hidden" accept="audio/*">

    <!-- Audio elements -->
    <audio id="gunshot" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmMgBCt6zvFkShgL" type="audio/wav">
    </audio>
    <audio id="bgMusic" loop></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((registration) => {
                        console.log('🎯 Service Worker registered successfully:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('🚫 Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
