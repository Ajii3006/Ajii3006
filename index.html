<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Attacking Depression - 3D Therapy Game</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#667eea">
    
    <!-- APK Compatibility Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attacking Depression">
    <meta name="application-name" content="Attacking Depression">
    <meta name="msapplication-TileColor" content="#667eea">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Security and Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Preload Critical Resources -->
    <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    <link rel="preload" as="script" href="game.js">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overscroll-behavior: none;
        }

        /* Fix for APK canvas rendering */
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            cursor: crosshair;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Game UI */
        .game-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            font-size: 16px;
        }

        .top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: env(safe-area-inset-left, 10px);
            right: env(safe-area-inset-right, 10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            min-height: 40px;
        }

        .health-bar {
            flex: 1;
            max-width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 10px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573);
            width: 100%;
            transition: width 0.3s ease;
        }

        .score {
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        /* Control Panel - Fixed for APK */
        .control-panel {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: all;
            padding: 0 20px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            min-width: 60px;
            min-height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 1);
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .music-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .fire-btn {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #ff4757;
            width: 80px;
            height: 80px;
            min-width: 80px;
            min-height: 80px;
            font-size: 30px;
        }

        /* Menu Overlay - APK Safe */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: all;
            padding: 20px;
        }

        .menu-title {
            font-size: clamp(2em, 8vw, 3em);
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
            line-height: 1.2;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255,255,255,0.5); }
            to { text-shadow: 0 0 30px rgba(255,255,255,0.8); }
        }

        .menu-subtitle {
            color: #ccc;
            font-size: clamp(1em, 4vw, 1.2em);
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.4;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: clamp(1.2em, 5vw, 1.5em);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 60px;
        }

        .start-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 1100;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        .crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        /* Hidden file inputs */
        .hidden {
            display: none !important;
            visibility: hidden !important;
        }

        /* Particle effect overlay */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        /* Hit indicator */
        .hit-indicator {
            position: absolute;
            color: #ff4757;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            z-index: 1500;
            animation: hitFade 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes hitFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5) translateY(-50px); }
        }

        /* Mobile specific optimizations */
        @media (max-width: 768px) {
            .menu-title {
                font-size: clamp(1.8em, 6vw, 2.5em);
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                min-width: 50px;
                min-height: 50px;
                font-size: 20px;
            }
            
            .fire-btn {
                width: 70px;
                height: 70px;
                min-width: 70px;
                min-height: 70px;
                font-size: 25px;
            }
            
            .top-bar {
                padding: 8px 12px;
                font-size: 14px;
            }
            
            .score {
                font-size: 14px;
            }
        }

        /* Landscape orientation fixes */
        @media (orientation: landscape) and (max-height: 500px) {
            .control-panel {
                bottom: 10px;
            }
            
            .top-bar {
                top: 5px;
                left: 5px;
                right: 5px;
                padding: 5px 10px;
            }
            
            .menu-title {
                font-size: clamp(1.5em, 5vw, 2em);
            }
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 3000;
        }

        /* Prevent context menu on long press */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Fix for APK status bar */
        @supports (padding-top: env(safe-area-inset-top)) {
            .menu-overlay {
                padding-top: env(safe-area-inset-top);
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">🎯 Loading Game...</div>

    <!-- Menu Overlay -->
    <div id="menuOverlay" class="menu-overlay">
        <h1 class="menu-title">ATTACKING DEPRESSION</h1>
        <p class="menu-subtitle">Transform your struggles into strength</p>
        <button id="startBtn" class="start-btn">🎯 START THERAPY</button>
    </div>

    <!-- Game UI -->
    <div class="game-ui" id="gameUI" style="display: none;">
        <div class="top-bar">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="health-bar">
                <div class="health-fill" id="healthFill"></div>
            </div>
            <div class="score">Hits: <span id="hits">0</span></div>
        </div>

        <div class="crosshair"></div>

        <div class="control-panel">
            <button class="control-btn upload-btn" id="uploadBtn" title="Upload Image">📷</button>
            <button class="control-btn music-btn" id="musicBtn" title="Background Music">🎵</button>
            <button class="control-btn fire-btn" id="fireBtn" title="Fire!">🔥</button>
        </div>
    </div>

    <!-- Particle Effects -->
    <canvas class="particles" id="particles"></canvas>

    <!-- Hidden file inputs with proper mobile attributes -->
    <input type="file" id="imageInput" class="hidden" accept="image/*" capture="environment" multiple="false">
    <input type="file" id="musicInput" class="hidden" accept="audio/*" multiple="false">

    <!-- Audio elements with better mobile support -->
    <audio id="gunshot" preload="auto" crossorigin="anonymous">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmMgBCt6zvFkShgL" type="audio/wav">
    </audio>
    <audio id="bgMusic" loop crossorigin="anonymous"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="game.js" defer></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        // Hide loading indicator once page loads
        window.addEventListener('load', () => {
            document.getElementById('loading').style.display = 'none';
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((registration) => {
                        console.log('🎯 Service Worker registered successfully:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('🚫 Service Worker registration failed:', error);
                    });
            });
        }

        // Prevent zoom on double tap (APK fix)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Prevent scroll on touch devices
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // Fix for APK orientation changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                // Force viewport recalculation
                const viewport = document.querySelector('meta[name=viewport]');
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover');
            }, 100);
        });

        // Error handling for APK
        window.addEventListener('error', (e) => {
            console.error('APK Error:', e.error);
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('APK Promise Rejection:', e.reason);
        });
    </script>
</body>
</html>
